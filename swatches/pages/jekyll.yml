# Managed by Tailor: pages
# Generator: jekyll
name: Pages

on:
  push:
    branches:
      - [[quote .Branch]]

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      SITE_PATH: [[quote .Path]]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3.12"
          working-directory: [[quote .Path]]
          bundler-cache: true
      - name: Build Jekyll
        env:
          JEKYLL_ENV: production
          BUNDLE_FROZEN: "true"
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
        run: |
          cd -- "$SITE_PATH"
          ruby -ryaml -e 'File.write(ARGV[0], {"url" => ENV.fetch("PAGES_ORIGIN")}.to_yaml)' "$RUNNER_TEMP/pages-url.yml"
          bundle exec jekyll build --config "_config.yml,$RUNNER_TEMP/pages-url.yml" --baseurl "$PAGES_BASE_PATH" --destination _site
      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: [[quote (printf "%s/_site" .Path)]]

  deploy:
    needs: build
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
