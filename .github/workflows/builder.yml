name: Builder 👷

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 0" # Sundays at 09:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-code:
    name: Lint Code 🧹
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          args: --config .golangci.yml

  lint-actions:
    name: Lint Action ⚙️
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: freerangebytes/setup-actionlint@32c8a5082cfc12c6aa71aeb22496372ea6ea15df # v0.1.2
      - name: Run actionlint
        run: |
          echo "::add-matcher::.github/actionlint-matcher.json"
          actionlint -color

  coverage:
    name: Coverage 📊
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Install just
        run: nix profile add --inputs-from . --no-write-lock-file nixpkgs#just
      - uses: robherley/go-test-action@2f859e0c8769d755d3174eecb9af8f64660827f3 # v1.1.0
        env:
          TAILOR_TEST_PLAYWRIGHT_NIX_BUILDS: "1"
        with:
          testArguments: -coverprofile=coverage.out -covermode=atomic ./...
          omit: untested

  test:
    name: Test 🧪
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-15
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Nix
        if: runner.os != 'macOS' || runner.arch != 'X64'
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Install Nix on Intel macOS
        if: runner.os == 'macOS' && runner.arch == 'X64'
        shell: bash
        run: |
          installer="$RUNNER_TEMP/install-nix-2.35.2"
          curl --fail --location --retry 5 \
            --output "$installer" \
            https://releases.nixos.org/nix/nix-2.35.2/install
          echo "9adda97297d9e8ab360df95c729eabff4f4f93d6db091953c3a68f29e3fb130c  $installer" \
            | shasum -a 256 --check
          cat > "$RUNNER_TEMP/nix.conf" <<EOF
          experimental-features = nix-command flakes
          ssl-cert-file = /etc/ssl/cert.pem
          trusted-users = root $USER
          EOF
          sh "$installer" --daemon --no-channel-add \
            --nix-extra-conf-file "$RUNNER_TEMP/nix.conf"
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
      - name: Install just
        if: runner.os != 'macOS' || runner.arch != 'X64'
        run: nix profile add --inputs-from . --no-write-lock-file nixpkgs#just
      - name: Install just on Intel macOS
        if: runner.os == 'macOS' && runner.arch == 'X64'
        shell: bash
        run: |
          archive="$RUNNER_TEMP/just-1.58.0-x86_64-apple-darwin.tar.gz"
          curl --fail --location --retry 5 \
            --output "$archive" \
            https://github.com/casey/just/releases/download/1.58.0/just-1.58.0-x86_64-apple-darwin.tar.gz
          echo "9a09cfef66aaa79da58203970103a0684307716caaabd3e9844cacc4dc0f4023  $archive" \
            | shasum -a 256 --check
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" just
          "$RUNNER_TEMP/bin/just" --version
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Fetch verified Blender test source
        if: matrix.runner == 'ubuntu-24.04'
        shell: bash
        run: |
          command -v patch
          command -v python3
          source=$(nix build --impure --no-link --print-out-paths --expr '
            let
              flake = builtins.getFlake (toString ./.);
              pkgs = import flake.inputs.nixpkgs { system = "x86_64-linux"; };
              blender = import ./swatches/nix/lib/blender.nix { inherit pkgs; };
            in blender.bridge.src.src
          ')
          test -d "$source"
          echo "TAILOR_BLENDER_TEST_SOURCE=$source" >> "$GITHUB_ENV"
      - name: Test
        env:
          TAILOR_TEST_PLAYWRIGHT_NIX_BUILDS: "1"
        run: just test
      - name: Build tailor
        run: go build -o tailor ./cmd/tailor
      - name: Measure
        run: ./tailor measure
      - name: Test container
        if: runner.os == 'Linux'
        run: |
          context=$(mktemp -d)
          arch=$(go env GOARCH)
          mkdir -p "$context/linux/$arch" "$context/repository"
          CGO_ENABLED=0 go build -o "$context/linux/$arch/tailor" ./cmd/tailor
          docker build --platform "linux/$arch" -t tailor:container-test -f Dockerfile "$context"
          test "$(docker image inspect --format '{{.Config.User}}' tailor:container-test)" = 65532
          docker run --rm --entrypoint git tailor:container-test --version
          git -C "$context/repository" init
          git -C "$context/repository" remote add origin https://github.com/octocat/container-test.git
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$context/repository:/work:ro" -w /work \
            tailor:container-test docket | grep -Eq '^repository: +octocat/container-test$'

  security:
    name: Security 🔒
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: moderate
          license-check: false
          fail-on-scopes: runtime
          comment-summary-in-pr: on-failure

      - name: Run govulncheck
        id: govulncheck
        if: ${{ !cancelled() }}
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          repo-checkout: false
          output-format: json
          output-file: govulncheck.json

      - name: Check vulnerabilities
        if: ${{ !cancelled() && steps.govulncheck.outcome == 'success' }}
        run: govulncheck -mode convert -format text < govulncheck.json

      - name: Generate SARIF
        if: >-
          !cancelled()
          && steps.govulncheck.outcome == 'success'
          && !github.event.repository.private
          && github.actor != 'dependabot[bot]'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        run: govulncheck -mode convert -format sarif < govulncheck.json > govulncheck.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: >-
          always() && !cancelled()
          && !github.event.repository.private
          && github.actor != 'dependabot[bot]'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
          && hashFiles('govulncheck.sarif') != ''
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck

  sentinel:
    name: Sentinel 👁️
    needs: [lint-code, lint-actions, coverage, test, security]
    if: always()
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Check results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  snapshot:
    name: Snapshot 📦
    needs: [sentinel]
    if: >-
      github.repository_owner == 'wimpysworld'
      && github.event_name != 'schedule'
      && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "v2.18.0"
          args: release --snapshot --clean --skip=sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release 📦
    needs: [sentinel]
    if: >-
      github.repository_owner == 'wimpysworld'
      && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_seconds: 30
          max_attempts: 3
          retry_wait_seconds: 10
          retry_on: error
          command: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "v2.18.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}

      - name: Update Go Report Card
        if: ${{ !contains(github.ref_name, '-') }}
        run: curl -X POST -F "repo=github.com/$GITHUB_REPOSITORY" https://goreportcard.com/checks || true
