---
version: 2

project_name: tailor

builds:
  - main: ./cmd/tailor
    binary: tailor
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - "-s -w -X main.version={{ .Version }}"

archives:
  - id: bare
    formats:
      - binary
    name_template: "tailor-{{ .Os }}-{{ .Arch }}"

  - id: compressed
    formats:
      - tar.gz
    format_overrides:
      - goos: darwin
        formats:
          - none
      - goos: windows
        formats:
          - none
    name_template: "tailor_{{ .Version }}_{{ .Arch }}"

checksum:
  name_template: "tailor_{{ .Version }}_checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  prerelease: auto
  footer: |
    ## Install

    - Debian and Ubuntu: [apt.wimpys.world](https://apt.wimpys.world/#tailor)
    - Fedora and openSUSE: [rpm.wimpys.world](https://rpm.wimpys.world/#tailor)
    - Arch Linux: [pkg.wimpys.world](https://pkg.wimpys.world/#tailor)
    - Alpine Linux: [apk.wimpys.world](https://apk.wimpys.world/#tailor)
    - macOS (Homebrew): [brew.wimpys.world](https://brew.wimpys.world/#tailor)
    - Windows (Scoop): [scoop.wimpys.world](https://scoop.wimpys.world/#tailor)
    - Nix and NixOS: [nix.wimpys.world](https://nix.wimpys.world/#tailor)
    - Any platform, with [bin](https://github.com/marcosnils/bin): `bin install github.com/wimpysworld/tailor`
    - Container: `docker run --rm ghcr.io/wimpysworld/tailor --version`

    Tailor needs a GitHub authentication token. Set `GH_TOKEN` or `GITHUB_TOKEN`, or run `gh auth login` locally.

nfpms:
  - id: packages
    vendor: Martin Wimpress
    maintainer: "Martin Wimpress <code@wimpress.io>"
    description: "Ready-to-wear project templates for GitHub repositories."
    homepage: https://github.com/wimpysworld/tailor
    license: BlueOak-1.0.0
    file_name_template: "{{ .ConventionalFileName }}"
    formats:
      - deb
      - rpm
      - apk
      - archlinux

aurs:
  - ids:
      - compressed
    name: tailor-bin
    description: "Ready-to-wear project templates for GitHub repositories."
    homepage: https://github.com/wimpysworld/tailor
    maintainers:
      - "Martin Wimpress <code@wimpress.io>"
    license: BlueOak-1.0.0
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/tailor-bin.git"
    package: |
      install -Dm755 tailor "${pkgdir}/usr/bin/tailor"

retry:
  attempts: 5
  delay: 10s
  max_delay: 2m

dockers_v2:
  - id: ghcr
    dockerfile: Dockerfile
    images:
      - "ghcr.io/wimpysworld/tailor"
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.description": "Ready-to-wear project templates for GitHub repositories."
      "org.opencontainers.image.source": "{{ .GitURL }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.licenses": "BlueOak-1.0.0"

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"

docker_signs:
  - cmd: cosign
    artifacts: all
    args:
      - "sign"
      - "--yes"
      - "${artifact}@${digest}"
